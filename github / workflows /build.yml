name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q FileTransfer-Android.zip
      - run: cd FileTransfer && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FileTransfer-APK
          path: FileTransfer/app/build/outputs/apk/debug/app-debug.apk
